# Touchpad add-on for Swifty. The base swifty_left.conf brings up
# BLE/USB and the kscan matrix; this layer adds pointing + I2C.

CONFIG_I2C=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Disable RGB underglow for this test build: swifty's WS2812 I2S
# wiring references an undefined i2s0_default_alt pinctrl group, so
# i2s0 is disabled in the overlay -- and the ws2812 driver must come
# along for the ride.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP_I2S=n

# UART console + log backend on uart0 (TX=P0.06, RX=P0.08).
# Read with: screen /dev/tty.usbserial-AO009146 115200
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
