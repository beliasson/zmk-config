CONFIG_ZMK_KEYBOARD_NAME="TPS65 DK"

# Phase-1 bring-up: no transports yet. Zephyr 4.1+zmk-fixes nRF54L20
# PDK support is incomplete -- CRACEN (crypto/RNG) is not wired up in
# the board DTS, so the BLE controller fails Kconfig (it needs
# ENTROPY_NRF_CRACEN_CTR_DRBG -> DT_HAS_NORDIC_NRF_CRACEN_CTRDRBG = n).
# USB on nRF54L is not listed as supported either. So we drive the
# touchpad event stream over RTT/log only until we can target a board
# that has full L-series peripheral support.
# CONFIG_ZMK_USB=y
# CONFIG_ZMK_BLE=y

# Pointing/mouse HID for when transports are enabled.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# I2C master driver for nRF TWIM.
CONFIG_I2C=y

# Useful logging during bring-up.
CONFIG_LOG=y
