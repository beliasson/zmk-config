CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Immediate (synchronous) log mode so a hang during driver init still
# emits prior messages -- deferred mode queues them and a background
# thread flushes, so a wedge before main means no output at all.
CONFIG_LOG_MODE_IMMEDIATE=y
